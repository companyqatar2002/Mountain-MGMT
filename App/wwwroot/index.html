<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mountain Management</title>
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111e;--cd:#141d2e;--tx:#e9eef9;--mu:#8e9ab5;--pr:#6aa2ff;--pr2:#7fb0ff;--ac:#f2b632;--gr:#3ecf97;--gr-bg:#0f2a21;--rd:#ff7b6b;--rd-bg:#2c1414;--or-bg:#2b2112;--bd:#263048;--in:#101929;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.3)}}

*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}

nav button:active,.btn:active{transform:scale(.97)}

.btn.p{background:var(--pr);color:#fff;border-color:var(--pr);box-shadow:var(--shadow-sm)}
.btn.p:hover{background:var(--pr2);border-color:var(--pr2);color:#fff}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:var(--radius);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow-sm);transition:box-shadow .2s}
.c:hover{box-shadow:var(--shadow)}
.g .c{margin:0}.c small{color:var(--mu);display:block;font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px}.c h3{margin:6px 0 0;font-size:24px;font-weight:700;letter-spacing:-.3px}
.c>b{font-size:15px;letter-spacing:.1px}
.in{color:var(--gr)}.out{color:var(--rd)}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font-size:14px;max-width:100%;transition:border-color .15s,box-shadow .15s;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(11,60,140,.12)}

.w{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:start;white-space:nowrap}
th{color:var(--mu);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:var(--bg)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:none}
.b{padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.2px;display:inline-block}
.g1{background:var(--gr-bg);color:var(--gr)}.r1{background:var(--rd-bg);color:var(--rd)}.o1{background:var(--or-bg);color:#c77d00}.m1{background:var(--bg);color:var(--mu)}
body{background-image:radial-gradient(circle at 15% 0%,rgba(11,60,140,.05),transparent 45%),radial-gradient(circle at 100% 0%,rgba(242,182,50,.07),transparent 40%);background-attachment:fixed}
.lg{max-width:400px;margin:9vh auto;text-align:center;padding:36px 28px}
.lg h2{font-size:19px;margin:0 0 20px;color:var(--pr);letter-spacing:-.2px}
.lg input{width:100%;margin:7px 0}.lg .btn{width:100%;margin-top:12px;padding:11px;font-weight:700}
.note{font-size:12px;color:var(--mu);line-height:1.5}
#toast{color:var(--rd);min-height:20px;padding:6px 18px;text-align:center;font-weight:600;font-size:13px}
.warn{background:linear-gradient(90deg,var(--rd),#e0634f);color:#fff;padding:9px 18px;text-align:center;font-weight:600;font-size:13.5px}
code{background:var(--bg);padding:2px 7px;border-radius:6px;font-size:13px;border:1px solid var(--bd)}
a.btn{text-decoration:none;display:inline-block}
@media(max-width:640px){
  main{padding:12px 10px 30px}
  header{padding:10px 12px}header b{font-size:14px}
  nav{padding:8px 10px}nav button,.btn{padding:8px 12px;font-size:13px}
  .c{padding:13px 14px;border-radius:12px}
  .g{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .c h3{font-size:20px}
  th,td{padding:8px 9px;font-size:12.5px}
  .lg{margin:6vh auto;padding:26px 18px;max-width:94vw}
}
</style>
</head>

 <div class="c"><b>${t("pw")}</b><div class="f"><label>${t("oldpw")}<input id="o_p" type="password"></label><label>${t("newpw")}<input id="o_n" type="password"></label><button class="btn p" onclick="chPw()">${t("save")}</button></div></div>
 <div class="c" id="tfBox"><b>${t("twofactor")}</b><div id="tfInner" style="margin-top:8px">${S.me.two_factor_on?`<p class="note">${t("tfEnabled")}</p><div class="f"><input id="tf_pw" type="password" placeholder="${t("password")}"><button class="btn" onclick="disable2fa()">${t("tfOff")}</button></div>`:S.tf2setup?`<p>${t("tfScan")}</p><p><code>${esc(S.tf2setup.secret)}</code></p><div class="f"><input id="tf_confirm" placeholder="${t("tfConfirm")}" maxlength="6" inputmode="numeric"><button class="btn p" onclick="confirm2fa()">${t("tfOn")}</button></div>`:`<button class="btn p" onclick="setup2fa()">${t("tfSetup")}</button>`}</div></div>`;
 if(isA()){h+=`<div class="c"><b>${t("closem")}</b><div class="f"><input id="cm" type="month"><button class="btn" onclick="closeM()">${t("closeb")}</button></div></div>`;
  const cat=await api("/reports/by-category");
  h+=`<div class="c w"><b>${t("byCategory")}</b> <span class="note">(${t("month")})</span><table><tr><th>${t("type")}</th><th>${t("cat")}</th><th>${t("amt")}</th></tr>${cat.map(c=>`<tr><td>${t(c.type)}</td><td>${esc(c.category)}</td><td class="${c.type==="income"?"in":"out"}">${fm(c.amount)}</td></tr>`).join("")||`<tr><td class="note" colspan="3">—</td></tr>`}</table></div>`}
 if(isSA()){const st=await api("/settings"),bs=await api("/branches");
  h+=`<div class="c"><b>${t("brand")}</b><div class="f" style="margin-top:8px"><label>${t("cname")}<input id="s_n" value="${esc(st.company_name)}" style="width:280px"></label><label>${t("lend")}<input id="s_l" type="date" value="${st.license_end}"></label><button class="btn p" onclick="saveS()">${t("save")}</button></div><div class="f" style="margin-top:10px">${bs.map(b=>`<label>${t("cr")} – ${esc(b.name)}<input value="${esc(b.cr)}" style="width:140px" onchange="setCr(${b.id},this.value)"></label>`).join("")}</div></div>`}
 return h}};
const run=async f=>{try{await f();toast("");draw()}catch(e){toast(e.message)}};
const addTx=()=>run(()=>api("/tx",{m:"POST",b:{date:$("f_d").value,branch_id:+$("f_b").value,type:$("f_t").value,category:$("f_c").value,description:$("f_s").value,amount:$("f_a").value,paid_by:$("f_p").value,worker_qid:$("f_q").value}}));
const dec=(id,a)=>{let b={};if(a==="cancel"){const r=prompt(t("reason"));if(!r)return;b={reason:r}}run(()=>api(`/tx/${id}/${a}`,{m:"POST",b}))};
const addW=()=>run(()=>api("/workers",{m:"POST",b:{qid:$("w_q").value,name:$("w_n").value,nationality:$("w_a").value,branch_id:+$("w_b").value,rp_expiry:$("w_e").value||null,fee:$("w_f")?$("w_f").value:0}}));
const addU=()=>run(()=>api("/users",{m:"POST",b:{username:$("n_u").value,name:$("n_n").value,password:$("n_p").value,role:$("n_r").value,branches:[...document.querySelectorAll(".ub:checked")].map(c=>+c.value)}}));
const actU=(id,v)=>run(()=>api("/users/"+id,{m:"PATCH",b:{active:v}}));
const pref=(k,v)=>{S[k]=v;run(()=>api("/me",{m:"PATCH",b:{[k]:v}}))};
const chPw=()=>run(async()=>{await api("/me",{m:"PATCH",b:{old:$("o_p").value,password:$("o_n").value}});toast("✔")});
const closeM=()=>run(()=>api("/close",{m:"POST",b:{month:$("cm").value}}));
const saveS=()=>run(async()=>{await api("/settings",{m:"PATCH",b:{company_name:$("s_n").value,license_end:$("s_l").value}});S.me=await api("/me")});
const setCr=(id,v)=>api("/branches/"+id,{m:"PATCH",b:{cr:v}}).catch(e=>toast(e.message));
const quickAttach=(sec,rec)=>{S.lastSection=sec;S.lastRecord=rec;go("tab","attachments")};
function remindBtns(r){
 const msg=encodeURIComponent(`Dear ${r.name}, a payment of QAR ${fm(r.balance)} is due on ${r.due_date}. Kindly settle at your earliest convenience. - Mountain Trading & Contracting`);
 const phone=(r.phone||"").replace(/[^0-9]/g,"");
 const wa=phone?`<a class="btn" href="https://wa.me/${phone}?text=${msg}" target="_blank" rel="noopener noreferrer">${t("whatsapp")}</a>`:"";
 const mail=r.email?`<a class="btn" href="mailto:${r.email}?subject=${encodeURIComponent("Payment Reminder")}&body=${msg}" target="_blank">${t("email")}</a>`:"";
 return wa+" "+mail}
const addCustomer=()=>run(()=>api("/customers",{m:"POST",b:{name:$("cu_n").value,company:$("cu_c").value,phone:$("cu_p").value,email:$("cu_e").value,branch_id:$("cu_b").value?+$("cu_b").value:null}}));
const addSupplier=()=>run(()=>api("/suppliers",{m:"POST",b:{name:$("su_n").value,company:$("su_c").value,phone:$("su_p").value,branch_id:$("su_b").value?+$("su_b").value:null}}));
const addProduct=()=>run(()=>api("/products",{m:"POST",b:{sku:$("pr_sku").value,name:$("pr_n").value,cost_price:+$("pr_cost").value||0,sale_price:+$("pr_sale").value||0,stock_qty:+$("pr_qty").value||0,reorder_level:+$("pr_rl").value||0,branch_id:$("pr_b").value?+$("pr_b").value:null}}));
const adjStock=id=>{const q=prompt("Quantity change (use - to remove)");if(!q||isNaN(+q)||+q===0)return;const note=prompt(t("linknotes"))||"";run(()=>api(`/products/${id}/stock`,{m:"POST",b:{qty:+q,note}}))};
const addLine=()=>{const d=$("it_desc").value,q=+$("it_qty").value,p=+$("it_price").value;if(!d||!(q>0)||!(p>=0)){toast(t("bad"));return}S.cart.push({desc:d,qty:q,price:p});$("it_desc").value="";$("it_qty").value="1";$("it_price").value="";toast("");draw()};
const rmLine=idx=>{S.cart.splice(idx,1);draw()};
const submitDoc=kind=>{if(S.cart.length===0){toast(t("bad"));return}
 const bid=+$("iv_branch").value,items=S.cart.map(i=>({description:i.desc,qty:i.qty,unit_price:i.price})),
 body={customer_id:+$("iv_cust").value,date:TD,discount:+$("iv_disc").value||0,tax:+$("iv_tax").value||0,notes:"",items};
 if(kind==="invoice")body.due_date=$("iv_due").value||null;else body.expiry_date=$("iv_due").value||null;
 run(async()=>{await api(`/${kind==="invoice"?"invoices":"estimates"}?branch_id=${bid}`,{m:"POST",b:body});S.cart=[]})};
const convertEst=id=>run(()=>api(`/estimates/${id}/convert`,{m:"POST"}));
const payInvoice=id=>{const a=prompt(t("amt"));if(!a||!(+a>0))return;run(()=>api(`/invoices/${id}/payments`,{m:"POST",b:{date:TD,amount:+a,method:"Cash"}}))};
const payBill=id=>{const a=prompt(t("amt"));if(!a||!(+a>0))return;run(()=>api(`/bills/${id}/payments`,{m:"POST",b:{date:TD,amount:+a,method:"Cash"}}))};
const payWorker=qid=>{const a=prompt(t("amt"));if(!a||!(+a>0))return;run(()=>api(`/workers/${qid}/payments`,{m:"POST",b:{date:TD,amount:+a,method:"Cash"}}))};
const addBill=()=>{const bid=+$("bl_b").value;run(()=>api(`/bills?branch_id=${bid}`,{m:"POST",b:{supplier_id:+$("bl_s").value,date:TD,due_date:$("bl_due").value||null,total:+$("bl_t").value,notes:""}}))};
const addContact=()=>run(()=>api("/contacts",{m:"POST",b:{code:$("ec_code").value,name:$("ec_n").value,contact_type:$("ec_t").value,company:$("ec_co").value,mobile:$("ec_p").value,branch_id:$("ec_b").value?+$("ec_b").value:null}}));
async function uploadFile(){const f=$("at_file").files[0];if(!f){toast(t("bad"));return}
 const fd=new FormData();fd.append("file",f);fd.append("section",$("at_sec").value);fd.append("record_id",$("at_rec").value);fd.append("note",$("at_note").value);
 try{const r=await fetch("/api/attachments",{method:"POST",headers:{Authorization:"Bearer "+S.tok},body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||"Error");toast("");draw()}catch(e){toast(e.message)}}
const delFile=id=>{if(confirm(t("delete")+"?"))run(()=>api("/attachments/"+id,{m:"DELETE"}))};
function exportCsv(rows,cols,filename){const esc2=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const lines=[cols.map(c=>esc2(c.h)).join(","),...rows.map(r=>cols.map(c=>esc2(r[c.k])).join(","))];
 const blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
const exportLedgerCsv=()=>exportCsv(S.lastLedger||[],[{h:"Receipt",k:"receipt_no"},{h:"Date",k:"date"},{h:"Branch",k:"branch_id"},{h:"Type",k:"type"},{h:"Category",k:"category"},{h:"Description",k:"description"},{h:"Amount",k:"amount"},{h:"Status",k:"status"}],"ledger.csv");
const exportWorkersCsv=()=>exportCsv(S.lastWorkers||[],[{h:"QID",k:"qid"},{h:"Name",k:"name"},{h:"Branch",k:"branch"},{h:"RP Expiry",k:"rp_expiry"},{h:"Days Left",k:"days_left"},{h:"Status",k:"rp_status"}],"workers.csv");
const setup2fa=()=>run(async()=>{S.tf2setup=await api("/me/2fa/setup",{m:"POST"})});
const confirm2fa=()=>run(async()=>{await api("/me/2fa/enable",{m:"POST",b:{code:$("tf_confirm").value}});S.tf2setup=null;S.me=await api("/me")});
const disable2fa=()=>run(async()=>{await api("/me/2fa/disable",{m:"POST",b:{password:$("tf_pw").value}});S.me=await api("/me")});
async function downloadAuth(url,filename){try{const r=await fetch(url,{headers:{Authorization:"Bearer "+S.tok}});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||"Error")}const blob=await r.blob();const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;a.click();URL.revokeObjectURL(u)}catch(e){toast(e.message)}}
async function importLedger(file){if(!file)return;const fd=new FormData();fd.append("file",file);
 try{const r=await fetch("/api/import/ledger",{method:"POST",headers:{Authorization:"Bearer "+S.tok},body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||"Error");
 alert(`${t("impResult")}: ${j.accepted}\n${t("impRejected")}: ${j.rejected}`+(j.errors&&j.errors.length?"\n\n"+j.errors.join("\n"):""));toast("");draw()}catch(e){toast(e.message)}}
async function importWorkers(file){if(!file)return;const fd=new FormData();fd.append("file",file);
 try{const r=await fetch("/api/import/workers",{method:"POST",headers:{Authorization:"Bearer "+S.tok},body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||"Error");
 alert(`${t("impResult")}: ${j.accepted}\n${t("impRejected")}: ${j.rejected}\n${t("impDup")}: ${j.skipped_duplicates}`+(j.errors&&j.errors.length?"\n\n"+j.errors.join("\n"):""));toast("");draw()}catch(e){toast(e.message)}}
const addLink=()=>run(()=>api("/links",{m:"POST",b:{name:$("l_n").value,url:$("l_u").value,notes:$("l_o").value}}));
const delLink=id=>{if(confirm(t("delete")+"?"))run(()=>api("/links/"+id,{m:"DELETE"}))};
if(S.tok)boot();else draw();
</script>
